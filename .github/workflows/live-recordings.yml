name: Live recording checks

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/LiveRecordingController.php'
      - 'routes/live-recordings.php'
      - 'routes/web.php'
      - 'routes/api.php'
      - 'bootstrap/app.php'
      - 'config/live_recorder.php'
      - 'app/Http/Controllers/LiveRecorderIngestController.php'
      - 'tests/Feature/LiveRecorderIngestTest.php'
      - 'resources/views/admin/live-recordings.blade.php'
      - 'scripts/live-recorder/**'
      - 'tests/Feature/LiveRecordingsTest.php'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  live-recording-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, intl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check web dependency lockfile
        run: npm ci --ignore-scripts
      - name: Check recorder JavaScript syntax
        run: |
          node --check scripts/live-recorder/worker.mjs
          node --check scripts/live-recorder/private-upload.mjs
          sh -n scripts/live-recorder/entrypoint.sh
          sh -n scripts/live-recorder/run-recorder.sh
      - name: PHP syntax checks
        run: |
          php -l app/Http/Controllers/LiveRecordingController.php
          php -l routes/live-recordings.php
          php -l app/Http/Controllers/LiveRecorderIngestController.php
          php -l routes/api.php
      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Test admin-only private media access
        run: php artisan test --filter='LiveRecordingsTest|LiveRecorderIngestTest'

  recorder-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Chrome/FFmpeg recorder image
        run: docker build -f scripts/live-recorder/Dockerfile -t smartdesk-recorder-ci .
