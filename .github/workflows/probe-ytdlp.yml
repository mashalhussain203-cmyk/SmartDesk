name: TEMP yt-dlp public stream access probe

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install latest yt-dlp and supported HTTP transport
        run: python -m pip install --disable-pip-version-check yt-dlp curl_cffi
      - name: Probe public playback metadata without recording or leaking stream URLs
        run: node scripts/live-recorder/probe-ytdlp.mjs
